services:
  astra-nbody:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-nbody:0.2.2
    container_name: astra-nbody-cpu
    command:
      - "--backend"
      - "auto"
      - "--particles"
      - "1024"
      - "--steps"
      - "100"
    volumes:
      - ./results:/app/results
    restart: "no"
    init: true
