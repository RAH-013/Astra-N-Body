services:
  astra-nbody:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-nbody:0.2.0
    container_name: astra-nbody
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - label=disable
    command:
      - "--backend"
      - "auto"
      - "--particles"
      - "1024"
      - "--steps"
      - "100"
    restart: "no"
    init: true
